name: Build Python interface with PardisoMKL

on:
  workflow_dispatch:
  # push

jobs:

  build-sdist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Install packages
      run: |
        set -eux
        sudo apt-get update
        sudo apt-get install -y gpg-agent wget
        wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
          | gpg --dearmor \
          | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
          | sudo tee /etc/apt/sources.list.d/oneAPI.list
        sudo apt-get update
        MKL_CORE_DEVEL_PKG="intel-oneapi-mkl-core-devel-2026.1"
        MKL_CLASSIC_INCLUDE_PKG="intel-oneapi-mkl-classic-include-2026.1"
        echo "Using MKL packages: ${MKL_CORE_DEVEL_PKG} ${MKL_CLASSIC_INCLUDE_PKG}"
        sudo apt-get install -y --no-install-recommends cmake ninja-build libopenblas-dev "${MKL_CORE_DEVEL_PKG}" "${MKL_CLASSIC_INCLUDE_PKG}"
        sudo apt-get install -y openmpi-bin libopenmpi-dev libsuitesparse-dev
        # see https://cppbinder.readthedocs.io/en/latest/install.html#id1
        sudo apt-get install -y clang-15 llvm-15 libclang-15-dev llvm-15-dev
        echo "MKLROOT=/opt/intel/oneapi/mkl/latest" >> "$GITHUB_ENV"
        echo "MKL_LIB_DIR=/opt/intel/oneapi/mkl/latest/lib" >> "$GITHUB_ENV"
        test -f /opt/intel/oneapi/mkl/latest/include/mkl_pardiso.h
        test -f /opt/intel/oneapi/mkl/latest/lib/libmkl_rt.so
        echo "MPICC=$(command -v mpicc)" >> "$GITHUB_ENV"
        echo "MPICXX=$(command -v mpicxx)" >> "$GITHUB_ENV"
        echo "MPI_EXEC=$(command -v mpiexec)" >> "$GITHUB_ENV"
        echo "MPIEXEC_EXECUTABLE=$(command -v mpiexec)" >> "$GITHUB_ENV"
        python3 -m pip install build
        MPICC="$(command -v mpicc)" python3 -m pip install --no-binary=mpi4py --no-cache-dir mpi4py
        python3 -c "from mpi4py import MPI; print(MPI.Get_library_version())"
        python3 -m pip install pybind11@git+https://github.com/pybind/pybind11.git@c6c9a9e59b2b64393de0432aa6867ed27367912a
    - name: Build Binder
      run: |
        git clone https://github.com/RosettaCommons/binder.git ../binder
        cmake -G Ninja \
              -D LLVM_DIR=/usr/lib/llvm-15/lib/cmake/llvm \
              -D Clang_DIR=/usr/lib/llvm-15/lib/cmake/clang \
              -D pybind11_DIR=`python3 -c "import pybind11; print(pybind11.get_cmake_dir())"` \
              -B ../binder-build \
              ../binder
        cmake --build ../binder-build
        ctest --test-dir ../binder-build --output-on-failure
        cmake --install ../binder-build
    - name: Clone Trilinos
      run: git clone https://github.com/trilinos/Trilinos.git --branch trilinos-release-16-2-1 --depth 1 ../trilinos
    - name: Copy ROL
      run: rsync -ar --delete . ../trilinos/packages/rol
    - name: Write version
      run: |
        cp pyrol/pyproject.toml ../trilinos/
        export TZ='America/Denver'
        # VERSION="$(date +%Y.%m.%d).dev$(date +%H%M)$(git rev-parse --abbrev-ref HEAD)$(git rev-parse --short HEAD)"
        VERSION="$(date +%Y.%m.%d).dev$(date +%H%M)"
        sed -i "s/version = \"VERSION\"/version = \"${VERSION}\"/" ../trilinos/pyproject.toml
    - name: Configure (requires running Binder)
      run: |
        cmake -G Ninja \
              -D CMAKE_BUILD_TYPE:STRING=RELEASE \
              -D CMAKE_C_COMPILER:FILEPATH="${MPICC}" \
              -D CMAKE_CXX_COMPILER:FILEPATH="${MPICXX}" \
              -D CPACK_SOURCE_IGNORE_FILES="/packages/rol/test;/packages/rol/tutorial;/packages/teuchos/core/test;/packages/teuchos/core/example;/packages/teuchos/numerics/test;/packages/teuchos/numerics/example;/packages/teuchos/parameterlist/test;/packages/teuchos/parameterlist/example;/packages/teuchos/parser/test;/packages/teuchos/parser/example;/packages/teuchos/remainder/test;/packages/teuchos/remainder/example;/packages/teuchos/comm/test;/packages/teuchos/comm/example" \
              -D BUILD_SHARED_LIBS:BOOL=ON \
              -D MPI_C_COMPILER:FILEPATH="${MPICC}" \
              -D MPI_CXX_COMPILER:FILEPATH="${MPICXX}" \
              -D MPI_EXEC:FILEPATH="${MPI_EXEC}" \
              -D MPIEXEC_EXECUTABLE:FILEPATH="${MPIEXEC_EXECUTABLE}" \
              -D TPL_ENABLE_MPI:BOOL=ON \
              -D TPL_ENABLE_SuiteSparse:BOOL=ON \
              -D TPL_ENABLE_MKL:BOOL=ON \
              -D TPL_ENABLE_PARDISO_MKL:BOOL=ON \
              -D Amesos2_ENABLE_PARDISO_MKL:BOOL=ON \
              -D MKL_INCLUDE_DIRS:PATH="${MKLROOT}/include" \
              -D MKL_LIBRARY_DIRS:PATH="${MKL_LIB_DIR}" \
              -D MKL_LIBRARY_NAMES:STRING="mkl_rt" \
              -D PARDISO_MKL_INCLUDE_DIRS:PATH="${MKLROOT}/include" \
              -D PARDISO_MKL_LIBRARY_DIRS:PATH="${MKL_LIB_DIR}" \
              -D PARDISO_MKL_LIBRARY_NAMES:STRING="mkl_rt" \
              -D ROL_ENABLE_EXAMPLES:BOOL=OFF \
              -D ROL_ENABLE_PYROL:BOOL=ON \
              -D ROL_ENABLE_TESTS:BOOL=OFF \
              -D PyROL_BINDER_clang_include_dirs:PATH="${LLVM_PREFIX}/include" \
              -D PyROL_BINDER_LibClang_include_dir:PATH="${LLVM_PREFIX}/lib/clang/${LLVM_VERSION}/include" \
              -D PyROL_BINDER_GCC_TOOLCHAIN:PATH="${GCC_PREFIX}" \
              -D PYROL_ENABLE_BINDER:BOOL=ON \
              -D PYROL_ENABLE_BINDER_UPDATE:BOOL=ON \
              -D Trilinos_CPACK_SOURCE_GENERATOR="TGZ" \
              -D Trilinos_ENABLE_ALL_OPTIONAL_PACKAGES:BOOL=OFF \
              -D Trilinos_ENABLE_CPACK_PACKAGING=ON \
              -D Trilinos_ENABLE_EXAMPLES:BOOL=OFF \
              -D Trilinos_ENABLE_Fortran:BOOL=OFF \
              -D Trilinos_ENABLE_ROL:BOOL=ON \
              -D Trilinos_ENABLE_Tpetra:BOOL=ON \
              -D Trilinos_ENABLE_Intrepid:BOOL=ON \
              -D Trilinos_ENABLE_Ifpack2:BOOL=ON \
              -D Trilinos_ENABLE_MueLu:BOOL=ON \
              -D Trilinos_ENABLE_Amesos2:BOOL=ON \
              -D Trilinos_ENABLE_Belos:BOOL=ON \
              -D Trilinos_ENABLE_TESTS:BOOL=OFF \
              -D PYROL_ENABLE_NAVIER_STOKES:BOOL=ON \
              -B ../trilinos-build \
              ../trilinos
    - name: Create reduced tarball (ROL + Binder files + Teuchos)
      run: |
        cmake --build ../trilinos-build --target package_source
    - name: Unpack reduced tarball
      run: |
        tar -zxf `find ../trilinos-build -name "*-Source.tar.gz" -print -quit`
        mv `find . -name "trilinos-*-Source" -print -quit` ../pyrol
        rm ../pyrol/packages/framework/asan_assets/dummy_dlclose.so
    - name: Create source distribution from upacked tarball
      run: |
        python3 -m build --sdist ../pyrol
    - name: Upload source distribution as an artifact
      uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: /home/runner/work/rol/pyrol/dist/*.tar.gz

  build-wheels:
    needs: build-sdist
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{matrix.os}}
    steps:
    - uses: actions/checkout@v4
    - name: Download source distribution artifact
      uses: actions/download-artifact@v4
      with:
        name: sdist
    - name: Store source distribution name
      run: |
        SDIST_NAME=$(find . -name "rol_python-*.tar.gz" -print -quit)
        echo $SDIST_NAME
        echo "SDIST_NAME=${SDIST_NAME}" >> $GITHUB_ENV
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Build wheels (Ubuntu)
      uses: pypa/cibuildwheel@v3.1.4
      with:
        output-dir: dist
        package-dir: ${{ env.SDIST_NAME }}
      env:
        CIBW_BUILD: "cp312-manylinux_x86_64"
        CIBW_SKIP: "*i686 *musllinux*"
        CIBW_BUILD_VERBOSITY: 1
        CIBW_ENVIRONMENT_LINUX: >
          PATH=/usr/lib64/openmpi/bin:$PATH
          LD_LIBRARY_PATH=/opt/intel-pypi-mkl/lib:/usr/lib64/openmpi/lib:$LD_LIBRARY_PATH
          MKLROOT=/opt/intel-pypi-mkl
          MKL_LIB_DIR=/opt/intel-pypi-mkl/lib
          MPICC=/usr/lib64/openmpi/bin/mpicc
          MPICXX=/usr/lib64/openmpi/bin/mpicxx
          OMPI_MCA_mtl=^ofi
          OMPI_MCA_pml=ob1
          OMPI_MCA_btl=self,tcp
          OMPI_ALLOW_RUN_AS_ROOT=1
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
          CMAKE_ARGS='-DCMAKE_C_COMPILER=/usr/lib64/openmpi/bin/mpicc -DCMAKE_CXX_COMPILER=/usr/lib64/openmpi/bin/mpicxx -DMPI_C_COMPILER=/usr/lib64/openmpi/bin/mpicc -DMPI_CXX_COMPILER=/usr/lib64/openmpi/bin/mpicxx -DMPI_EXEC=/usr/lib64/openmpi/bin/mpiexec -DMPIEXEC_EXECUTABLE=/usr/lib64/openmpi/bin/mpiexec -DTPL_ENABLE_MKL=ON -DTPL_ENABLE_PARDISO_MKL=ON -DAmesos2_ENABLE_PARDISO_MKL=ON -DMKL_INCLUDE_DIRS=/opt/intel-pypi-mkl/include -DMKL_LIBRARY_DIRS=/opt/intel-pypi-mkl/lib -DMKL_LIBRARY_NAMES=mkl_rt -DPARDISO_MKL_INCLUDE_DIRS=/opt/intel-pypi-mkl/include -DPARDISO_MKL_LIBRARY_DIRS=/opt/intel-pypi-mkl/lib -DPARDISO_MKL_LIBRARY_NAMES=mkl_rt'
        CIBW_BEFORE_ALL_LINUX: |
          set -eux
          dnf install -y openblas-devel ninja-build openmpi-devel suitesparse-devel
          /opt/python/cp312-cp312/bin/python -m pip install --no-cache-dir --prefix=/opt/intel-pypi-mkl mkl==2026.1.0 mkl-devel==2026.1.0 mkl-include
          MKL_PARDISO_HEADER="$(find /opt/intel-pypi-mkl -name mkl_pardiso.h -print -quit)"
          MKL_RT_LIB="$(find /opt/intel-pypi-mkl -name libmkl_rt.so -print -quit)"
          if [ -z "${MKL_RT_LIB}" ]; then
            MKL_RT_LIB="$(find /opt/intel-pypi-mkl -name 'libmkl_rt.so.*' -print -quit)"
          fi
          test -n "${MKL_PARDISO_HEADER}"
          test -n "${MKL_RT_LIB}"
          mkdir -p /opt/intel-pypi-mkl/include /opt/intel-pypi-mkl/lib
          if [ "$(dirname "${MKL_PARDISO_HEADER}")" != "/opt/intel-pypi-mkl/include" ]; then
            ln -sf "$(dirname "${MKL_PARDISO_HEADER}")"/*.h /opt/intel-pypi-mkl/include/
          fi
          if [ "$(dirname "${MKL_RT_LIB}")" != "/opt/intel-pypi-mkl/lib" ]; then
            ln -sf "$(dirname "${MKL_RT_LIB}")"/libmkl* /opt/intel-pypi-mkl/lib/
          fi
          if [ ! -f /opt/intel-pypi-mkl/lib/libmkl_rt.so ]; then
            ln -sf "${MKL_RT_LIB}" /opt/intel-pypi-mkl/lib/libmkl_rt.so
          fi
          test -f /opt/intel-pypi-mkl/include/mkl_pardiso.h
          test -f /opt/intel-pypi-mkl/lib/libmkl_rt.so
        CIBW_BEFORE_BUILD: |
          which mpicc
          which mpicxx
          which mpiexec
          mpicc --showme:command
          mpicxx --showme:command
          mpicc --showme:version
          python -m pip install --no-binary=mpi4py --no-cache-dir mpi4py
          python -c "from mpi4py import MPI; print(MPI.Get_library_version())"
        CIBW_TEST_COMMAND_LINUX: |
          cd {project}/packages/rol/pyrol/test/algorithm && python -m unittest test_typeU.py
          cd {project}/packages/rol/pyrol/test/navier_stokes && python -m unittest test_objective.py
    - name: Set artifact name
      run: |
        echo "ARTIFACT_NAME=wheels-linux-pardisomkl" >> $GITHUB_ENV
    - name: Upload wheels as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: dist/*
