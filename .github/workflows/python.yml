name: Build Python interface

on:
  workflow_dispatch:
  # push

jobs:

  build-sdist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build libopenblas-dev
        # see https://cppbinder.readthedocs.io/en/latest/install.html#id1
        sudo apt-get install -y clang-15 llvm-15 libclang-15-dev llvm-15-dev
        python3 -m pip install build
        python3 -m pip install pybind11@git+https://github.com/pybind/pybind11.git@c6c9a9e59b2b64393de0432aa6867ed27367912a
    - name: Build Binder
      run: |
        git clone https://github.com/RosettaCommons/binder.git ../binder
        cmake -G Ninja \
              -D LLVM_DIR=/usr/lib/llvm-15/lib/cmake/llvm \
              -D Clang_DIR=/usr/lib/llvm-15/lib/cmake/clang \
              -D pybind11_DIR=`python3 -c "import pybind11; print(pybind11.get_cmake_dir())"` \
              -B ../binder-build \
              ../binder
        cmake --build ../binder-build
        ctest --test-dir ../binder-build --output-on-failure
        cmake --install ../binder-build
    - name: Clone Trilinos
      run: git clone --branch trilinos-release-16-2-0 https://github.com/trilinos/Trilinos.git --depth 1 ../trilinos
    - name: Copy ROL
      run: rsync -ar --delete . ../trilinos/packages/rol
    - name: Write version
      run: |
        cp pyrol/pyproject.toml ../trilinos/
        export TZ='America/Denver'
        # VERSION="$(date +%Y.%m.%d).dev$(date +%H%M)$(git rev-parse --abbrev-ref HEAD)$(git rev-parse --short HEAD)"
        VERSION="$(date +%Y.%m.%d).dev$(date +%H%M)"
        sed -i "s/version = \"VERSION\"/version = \"${VERSION}\"/" ../trilinos/pyproject.toml
    - name: Set LLVM/GCC environment
      run: |
        echo "LLVM_PREFIX=/usr/lib/llvm-15" >> $GITHUB_ENV
        echo "LLVM_VERSION=15" >> $GITHUB_ENV
        echo "GCC_PREFIX=/usr" >> $GITHUB_ENV
    - name: Enable verbose ninja
      run: echo "NINJA_STATUS=[%f/%t] " >> $GITHUB_ENV
    - name: Show Binder include logic from copied CMakeLists
      run: |
        set -euxo pipefail
        nl -ba ../trilinos/packages/rol/pyrol/CMakeLists.txt | sed -n '290,310p'
    - name: Locate Intrepid_config.h
      run: |
        find ../trilinos-build -name "Intrepid_config.h" -print || true
        find ../trilinos -name "Intrepid_config.h" -print || true
    - name: Configure (requires running Binder)
      id: configure_trilinos
      continue-on-error: true
      run: |
        cmake -G Ninja \
              -D CMAKE_BUILD_TYPE:STRING=RELEASE \
              -D CPACK_SOURCE_IGNORE_FILES="/packages/rol/example;/packages/rol/test;/packages/rol/tutorial;/packages/teuchos/core/test;/packages/teuchos/core/example;/packages/teuchos/numerics/test;/packages/teuchos/numerics/example;/packages/teuchos/parameterlist/test;/packages/teuchos/parameterlist/example;/packages/teuchos/parser/test;/packages/teuchos/parser/example;/packages/teuchos/remainder/test;/packages/teuchos/remainder/example;/packages/teuchos/comm/test;/packages/teuchos/comm/example" \
              -D BUILD_SHARED_LIBS:BOOL=ON \
              -D ROL_ENABLE_EXAMPLES:BOOL=ON \
              -D ROL_ENABLE_PYROL:BOOL=ON \
              -D ROL_ENABLE_TESTS:BOOL=ON \
              -D PyROL_BINDER_clang_include_dirs:STRING="/home/runner/work/rol/trilinos/packages/intrepid/src;/home/runner/work/rol/trilinos/packages/intrepid/src/Shared;/home/runner/work/rol/trilinos/packages/intrepid/src/Discretization/Basis;/home/runner/work/rol/trilinos-build/packages/intrepid/src;/usr/lib/llvm-15/include" \
              -D CMAKE_CXX_FLAGS:STRING="-I/home/runner/work/rol/trilinos/packages/intrepid/src -I/home/runner/work/rol/trilinos/packages/intrepid/src/Shared -I/home/runner/work/rol/trilinos-build/packages/intrepid/src" \
              -D CMAKE_C_FLAGS:STRING="-I/home/runner/work/rol/trilinos/packages/intrepid/src -I/home/runner/work/rol/trilinos/packages/intrepid/src/Shared -I/home/runner/work/rol/trilinos-build/packages/intrepid/src" \
              -D PyROL_BINDER_GCC_TOOLCHAIN:PATH="${GCC_PREFIX}" \
              -D PyROL_BINDER_LibClang_include_dir:PATH="${LLVM_PREFIX}/lib/clang/${LLVM_VERSION}/include" \
              -D PYROL_ENABLE_BINDER:BOOL=ON \
              -D PYROL_ENABLE_BINDER_UPDATE:BOOL=ON \
              -D Trilinos_CPACK_SOURCE_GENERATOR="TGZ" \
              -D Trilinos_ENABLE_ALL_OPTIONAL_PACKAGES:BOOL=OFF \
              -D Trilinos_ENABLE_CPACK_PACKAGING=ON \
              -D Trilinos_ENABLE_EXAMPLES:BOOL=OFF \
              -D Trilinos_ENABLE_Fortran:BOOL=OFF \
              -D Trilinos_ENABLE_ROL:BOOL=ON \
              -D Trilinos_ENABLE_TESTS:BOOL=OFF \
              -D TPL_ENABLE_gtest=OFF \
              -D Trilinos_ENABLE_Intrepid:BOOL=ON \
              -D Trilinos_ENABLE_Ifpack2:BOOL=ON \
              -D Trilinos_ENABLE_MueLu:BOOL=ON \
              -D Trilinos_ENABLE_Amesos2:BOOL=ON \
              -D Trilinos_ENABLE_Tpetra:BOOL=ON \
              -D ROL_ENABLE_Tpetra:BOOL=ON \
              -B ../trilinos-build \
              -D CMAKE_VERBOSE_MAKEFILE:BOOL=ON \
              -D CMAKE_MESSAGE_LOG_LEVEL:STRING=VERBOSE \
              -D PYROL_BINDER_VERBOSE:BOOL=ON \
              ../trilinos

    - name: Locate common Intrepid headers
      if: always()
      run: |
        set -euxo pipefail
        for h in Intrepid_FieldContainer.hpp Intrepid_Basis.hpp Intrepid_Cubature.hpp Intrepid_CellTools.hpp Intrepid_FunctionSpaceTools.hpp Intrepid_RealSpaceTools.hpp; do
          echo "=== $h ==="
          find ../trilinos ../trilinos-build -name "$h" -print || true
        done

    - name : Locate tpetra
      if: always()
      run: |
        echo "=== Locate ROL_TpetraMultiVector.hpp ==="
        find ../trilinos -name "ROL_TpetraMultiVector.hpp" -print || true

        echo "=== Show parent of found header ==="
        for f in $(find ../trilinos -name "ROL_TpetraMultiVector.hpp" -print); do
          dirname "$f"
        done

        echo "=== Was it copied? ==="
        find ../trilinos-build/packages/rol/pyrol/include_tmp -name "ROL_TpetraMultiVector.hpp" -print || true

    - name: Debug after configure
      if: always()
      run: |
        set -euxo pipefail

        echo "=== Did CMakeCache get created? ==="
        ls -la ../trilinos-build || true
        test -f ../trilinos-build/CMakeCache.txt && echo "CMakeCache exists" || echo "No CMakeCache"

        echo "=== Search for Intrepid_FieldContainer.hpp in source tree ==="
        find ../trilinos -name "Intrepid_FieldContainer.hpp" -print || true

        echo "=== Search for Intrepid_FieldContainer.hpp in build tree ==="
        find ../trilinos-build -name "Intrepid_FieldContainer.hpp" -print || true

        echo "=== Dump Intrepid-related cache lines ==="
        if test -f ../trilinos-build/CMakeCache.txt; then
          grep -E "Trilinos_ENABLE_Intrepid|Trilinos_ENABLE_Intrepid2|Intrepid" ../trilinos-build/CMakeCache.txt || true
        fi

        echo "=== Dump binder-related cache lines ==="
        if test -f ../trilinos-build/CMakeCache.txt; then
          grep -E "PyROL_BINDER|BINDER|LIBCLANG|clang_include" ../trilinos-build/CMakeCache.txt || true
        fi

        echo "=== If include_tmp was generated, show offending header ==="
        if test -f ../trilinos-build/packages/rol/pyrol/include_tmp/meshmanager.hpp; then
          sed -n '1,80p' ../trilinos-build/packages/rol/pyrol/include_tmp/meshmanager.hpp
        fi

        echo "=== Check compile_commands.json ==="
        ls -la ../trilinos-build/compile_commands.json || true
        if test -f ../trilinos-build/compile_commands.json; then
          echo "=== Entries mentioning include_tmp ==="
          grep -n "include_tmp" ../trilinos-build/compile_commands.json || true

          echo "=== Entries mentioning meshmanager.hpp ==="
          grep -n "meshmanager.hpp" ../trilinos-build/compile_commands.json || true

          echo "=== Entries mentioning packages/intrepid/src ==="
          grep -n "packages/intrepid/src" ../trilinos-build/compile_commands.json || true
        fi

        echo "=== Search build tree for binder/clang commands ==="
        grep -RIn -- "clang" ../trilinos-build/packages/rol/pyrol ../trilinos-build/CMakeFiles | head -n 200 || true
        grep -RIn -- "include_tmp" ../trilinos-build/packages/rol/pyrol ../trilinos-build/CMakeFiles | head -n 200 || true

        echo "=== Show CMakeError.log if present ==="
        if test -f ../trilinos-build/CMakeFiles/CMakeError.log; then
          tail -n 200 ../trilinos-build/CMakeFiles/CMakeError.log
        fi

        echo "=== Show CMakeOutput.log if present ==="
        if test -f ../trilinos-build/CMakeFiles/CMakeOutput.log; then
          tail -n 200 ../trilinos-build/CMakeFiles/CMakeOutput.log
        fi

    - name: Debug search generated build files for Intrepid include flags
      if: always()
      run: |
        set -euxo pipefail
        echo "=== Search build files for Intrepid src include path ==="
        grep -RIn -- "/home/runner/work/rol/trilinos/packages/intrepid/src" ../trilinos-build | head -n 200 || true

        echo "=== Search build files for Intrepid_FieldContainer.hpp mentions ==="
        grep -RIn -- "Intrepid_FieldContainer.hpp" ../trilinos-build | head -n 200 || true

        echo "=== Search source/build trees for PyROL_BINDER_clang_include_dirs consumption ==="
        grep -RIn -- "PyROL_BINDER_clang_include_dirs" ../trilinos/packages/rol ../trilinos-build | head -n 200 || true

        echo "=== Search source/build trees for binder command generation ==="
        grep -RIn -- "binder" ../trilinos/packages/rol/pyrol ../trilinos-build/packages/rol/pyrol | head -n 200 || true

    - name: Stop if configure failed
      if: steps.configure_trilinos.outcome != 'success'
      run: |
        echo "Configure failed; stopping after diagnostics."
        exit 1

    - name: Create reduced tarball (ROL + Binder files + Teuchos)
      run: |
        cmake --build ../trilinos-build --target package_source
    - name: Unpack reduced tarball
      run: |
        tar -zxf `find ../trilinos-build -name "*-Source.tar.gz" -print -quit`
        mv `find . -name "trilinos-*-Source" -print -quit` ../pyrol
        rm ../pyrol/packages/framework/asan_assets/dummy_dlclose.so
    - name: Create source distribution from upacked tarball
      run: |
        python3 -m build --sdist ../pyrol
    - name: Upload source distribution as an artifact
      uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: /home/runner/work/rol/pyrol/dist/*.tar.gz

  build-wheels:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build-sdist
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{matrix.os}}
    steps:
    - uses: actions/checkout@v4
    - name: Download source distribution artifact
      uses: actions/download-artifact@v4
      with:
        name: sdist
    - name: Store source distribution name
      run: |
        SDIST_NAME=$(find . -name "rol_python-*.tar.gz" -print -quit)
        echo $SDIST_NAME
        echo "SDIST_NAME=${SDIST_NAME}" >> $GITHUB_ENV
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Build wheels (Ubuntu and Mac)
      uses: pypa/cibuildwheel@v3.1.4
      with:
        output-dir: dist
        package-dir: ${{ env.SDIST_NAME }}
      env:
        CIBW_BUILD: "cp3*"
        CIBW_SKIP: "*i686 *musllinux*"
        CIBW_BUILD_VERBOSITY: 1
        CIBW_BEFORE_ALL_LINUX: |
          yum install -y openblas-devel ninja-build
        CIBW_TEST_COMMAND: 
          cd {project}/packages/rol/pyrol/test/algorithm && python -m unittest test_typeU.py
    - name: Set artifact name
      run: |
        if [[ "${{ runner.os }}" == "Linux" ]]; then
          echo "ARTIFACT_NAME=wheels-linux" >> $GITHUB_ENV
        elif [[ "${{ runner.os }}" == "macOS" ]]; then
          echo "ARTIFACT_NAME=wheels-macos" >> $GITHUB_ENV
        fi
    - name: Upload wheels as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: dist/*
  
  publish-pypi:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs:
    - build-sdist
    - build-wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rol-python
    permissions:
      id-token: write
    steps:
    - name: Download the source distribution
      uses: actions/download-artifact@v4
      with:
        name: sdist
        path: dist/
    - name: Download the Linux wheels
      uses: actions/download-artifact@v4
      with:
        name: wheels-linux
        path: dist/
    - name: Download the MacOS wheels
      uses: actions/download-artifact@v4
      with:
        name: wheels-macos
        path: dist/
    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        verbose: true
